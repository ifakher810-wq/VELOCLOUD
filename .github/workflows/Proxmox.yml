
name: Proxmox + Pinggy

on:
  workflow_dispatch:

jobs:
  proxmox:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Start Proxmox
        run: |
          docker run -itd \
            --name proxmox \
            --hostname pve \
            --privileged \
            -p 8006:8006 \
            rtedpro/proxmox:9.0.11

      - name: Pinggy Temporary Tunnel
        run: |
          while true; do
            echo "================================"
            echo "Creating New Pinggy Tunnel"
            echo "================================"

            timeout 3600 ssh -tt \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -p 443 \
              -R0:localhost:8006 \
              qr+tcp@free.pinggy.io || true

            echo "Old Tunnel Closed"
            echo "Creating New Tunnel..."
            sleep 3
          done
          
