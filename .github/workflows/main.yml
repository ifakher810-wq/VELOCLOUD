
name: VELOCLOUD Temporary VPS

on:
  workflow_dispatch:

jobs:
  velocloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Create VELOCLOUD VPS
        run: |
          sudo hostnamectl set-hostname VELOCLOUD
          echo "VELOCLOUD VPS Started!"
          hostname

      - name: Start SSHX
        run: |
          curl -sSf https://sshx.io/get | sh -s run
          
